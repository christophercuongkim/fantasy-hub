<!-- @dsCard group="Brand" viewport="700x200" subtitle="Phosphor. Regular for UI, Fill for active, Bold under 14px, Duotone for empty states." name="Iconography" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="col" style="gap:var(--space-6)">

  <div class="row" style="align-items:center;gap:18px">
    <span class="tok" style="width:78px">regular</span>
    <div class="row" style="gap:16px">
      <img src="https://api.iconify.design/ph:magnifying-glass.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:calendar-blank.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:map-pin.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:chart-bar.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:bell.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:user.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:airplane-tilt.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:trophy.svg?color=%23f4f4f0" width="20" height="20" alt="">
    </div>
    <span class="tok" style="margin-left:auto;color:var(--text-tertiary)">UI default · 16/20px</span></div>
  <div class="row" style="align-items:center;gap:18px">
    <span class="tok" style="width:78px">fill</span>
    <div class="row" style="gap:16px">
      <img src="https://api.iconify.design/ph:magnifying-glass-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:calendar-blank-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:map-pin-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:chart-bar-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:bell-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:user-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:airplane-tilt-fill.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:trophy-fill.svg?color=%23e58252" width="20" height="20" alt="">
    </div>
    <span class="tok" style="margin-left:auto;color:var(--text-tertiary)">active state</span></div>
  <div class="row" style="align-items:center;gap:18px">
    <span class="tok" style="width:78px">bold</span>
    <div class="row" style="gap:16px">
      <img src="https://api.iconify.design/ph:magnifying-glass-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:calendar-blank-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:map-pin-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:chart-bar-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:bell-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:user-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:airplane-tilt-bold.svg?color=%23f4f4f0" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:trophy-bold.svg?color=%23f4f4f0" width="20" height="20" alt="">
    </div>
    <span class="tok" style="margin-left:auto;color:var(--text-tertiary)">14px and below</span></div>
  <div class="row" style="align-items:center;gap:18px">
    <span class="tok" style="width:78px">duotone</span>
    <div class="row" style="gap:16px">
      <img src="https://api.iconify.design/ph:magnifying-glass-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:calendar-blank-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:map-pin-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:chart-bar-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:bell-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:user-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:airplane-tilt-duotone.svg?color=%23e58252" width="20" height="20" alt=""><img src="https://api.iconify.design/ph:trophy-duotone.svg?color=%23e58252" width="20" height="20" alt="">
    </div>
    <span class="tok" style="margin-left:auto;color:var(--text-tertiary)">empty states, slides</span></div>
</div>
</body>
</html>
