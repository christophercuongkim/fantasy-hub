<!-- @dsCard group="Brand" viewport="700x200" subtitle="Entrances overshoot, exits do not. Hover the row to replay." name="Motion" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="col" style="gap:var(--space-6)">

  <div class="row" style="align-items:center;gap:16px" onmouseenter="this.querySelector('i').style.animation='none';void this.offsetWidth;this.querySelector('i').style.animation=''">
    <span class="tok" style="width:110px">spring</span>
    <div style="position:relative;flex:1;height:16px;background:var(--surface-inset);border:1px solid var(--border-subtle)">
      <i style="position:absolute;top:-1px;left:0;width:16px;height:16px;background:var(--fill-accent);animation:slide 2.4s cubic-bezier(0.34,1.56,0.64,1) infinite"></i></div>
    <span class="tok" style="width:150px;text-align:right">enter, press, activate · 200ms</span></div>
  <div class="row" style="align-items:center;gap:16px" onmouseenter="this.querySelector('i').style.animation='none';void this.offsetWidth;this.querySelector('i').style.animation=''">
    <span class="tok" style="width:110px">out</span>
    <div style="position:relative;flex:1;height:16px;background:var(--surface-inset);border:1px solid var(--border-subtle)">
      <i style="position:absolute;top:-1px;left:0;width:16px;height:16px;background:var(--fill-accent);animation:slide 2.4s cubic-bezier(0.16,1,0.30,1) infinite"></i></div>
    <span class="tok" style="width:150px;text-align:right">layout shift, reorder · 320ms</span></div>
  <div class="row" style="align-items:center;gap:16px" onmouseenter="this.querySelector('i').style.animation='none';void this.offsetWidth;this.querySelector('i').style.animation=''">
    <span class="tok" style="width:110px">exit</span>
    <div style="position:relative;flex:1;height:16px;background:var(--surface-inset);border:1px solid var(--border-subtle)">
      <i style="position:absolute;top:-1px;left:0;width:16px;height:16px;background:var(--fill-accent);animation:slide 2.4s cubic-bezier(0.4,0,1,1) infinite"></i></div>
    <span class="tok" style="width:150px;text-align:right">leave · 140ms</span></div>
</div>
<style>@keyframes slide{0%{left:0}50%{left:calc(100% - 16px)}100%{left:0}}</style>
</body>
</html>
