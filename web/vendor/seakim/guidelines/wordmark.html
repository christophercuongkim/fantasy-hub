<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark (no logo supplied)</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="col" style="gap:var(--space-6)">
  <div class="row" style="gap:var(--space-11);align-items:baseline">
    <span style="font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:var(--tracking-tight)">SeaKim</span>
    <span style="font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:var(--tracking-tight);color:var(--text-accent)">Voyage</span>
    <span style="font-family:var(--font-display);font-size:32px;font-weight:600;letter-spacing:var(--tracking-tight)">Bench</span>
  </div>
  <p style="font:var(--type-body-sm);color:var(--text-tertiary);max-width:70ch">Replace with a real mark when one exists. Until then the wordmark is type, never a drawn glyph, never a monogram in a square.</p>
</div>
</body>
</html>
