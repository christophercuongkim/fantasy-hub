<!-- @dsCard group="Type" viewport="700x190" subtitle="Every number is mono and tabular. Caps are mono only, with --tracking-caps." name="Data + eyebrow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data + eyebrow</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="col" style="gap:var(--space-6)">
  <div class="col" style="gap:6px"><span class="tok">--type-eyebrow</span>
    <span style="font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);color:var(--text-secondary)">WEEK 4 · SUNDAY</span></div>
  <div class="col" style="gap:6px"><span class="tok">--type-data · tabular, signed deltas</span>
    <div class="row" style="gap:20px;font:var(--type-data);font-variant-numeric:tabular-nums">
      <span>$412.60</span><span>07:45 → 11:20</span>
      <span style="color:var(--text-success)">+18.4</span>
      <span style="color:var(--text-danger)">−3.2</span>
      <span style="color:var(--text-tertiary)">2 of 14</span></div></div>
  <div class="col" style="gap:6px"><span class="tok">table column label</span>
    <div class="row" style="gap:28px;font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);color:var(--text-tertiary)"><span>PLAYER</span><span>OPP</span><span>PROJ</span><span>OWN%</span></div></div>
</div>
</body>
</html>
