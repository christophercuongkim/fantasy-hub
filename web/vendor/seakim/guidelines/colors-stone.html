<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm neutral — hue ~65, chroma under 0.01. Does all structural work." name="Stone ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stone ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
  .ramp { display:grid; grid-template-columns: repeat(13, 1fr); gap:0; border:1px solid var(--border-subtle); }
  .ramp div { height:64px; }
  .labels { display:grid; grid-template-columns: repeat(13,1fr); gap:0; margin-top:6px; }
  .labels span { font: var(--type-eyebrow); color: var(--text-tertiary); text-align:center; font-size:9px; }
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="ramp"><div style="background:var(--stone-950)"></div><div style="background:var(--stone-900)"></div><div style="background:var(--stone-850)"></div><div style="background:var(--stone-800)"></div><div style="background:var(--stone-700)"></div><div style="background:var(--stone-600)"></div><div style="background:var(--stone-500)"></div><div style="background:var(--stone-400)"></div><div style="background:var(--stone-300)"></div><div style="background:var(--stone-200)"></div><div style="background:var(--stone-100)"></div><div style="background:var(--stone-50)"></div><div style="background:var(--stone-0)"></div></div>
<div class="labels"><span>950</span><span>900</span><span>850</span><span>800</span><span>700</span><span>600</span><span>500</span><span>400</span><span>300</span><span>200</span><span>100</span><span>50</span><span>0</span></div>
</body>
</html>
