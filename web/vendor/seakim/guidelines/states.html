<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interaction states</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="row" style="gap:var(--space-6);flex-wrap:wrap">

  <div class="col" style="gap:8px;align-items:center">
    <div style="background:var(--fill-accent);color:var(--on-accent);height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label)">Add to trip</div>
    <span class="tok">Rest</span></div>
  <div class="col" style="gap:8px;align-items:center">
    <div style="background:var(--fill-accent-hover);color:var(--on-accent);height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label)">Add to trip</div>
    <span class="tok">Hover</span></div>
  <div class="col" style="gap:8px;align-items:center">
    <div style="background:var(--fill-accent-active);color:var(--on-accent);transform:scale(0.97);height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label)">Add to trip</div>
    <span class="tok">Press</span></div>
  <div class="col" style="gap:8px;align-items:center">
    <div style="background:var(--fill-accent);color:var(--on-accent);box-shadow:var(--focus-ring);height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label)">Add to trip</div>
    <span class="tok">Focus</span></div>
  <div class="col" style="gap:8px;align-items:center">
    <div style="background:var(--fill-accent);color:var(--on-accent);opacity:0.4;height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label)">Add to trip</div>
    <span class="tok">Disabled</span></div>
  <div class="col" style="gap:8px;align-items:center">
    <div class="live" style="height:var(--control-h-md);display:flex;align-items:center;padding:0 var(--space-5);font:var(--type-label);background:var(--fill-accent);color:var(--on-accent);transition:var(--transition-control);cursor:pointer">Live — try it</div>
    <span class="tok">interactive</span></div>
</div>
<style>.live:hover{background:var(--fill-accent-hover)}.live:active{background:var(--fill-accent-active);transform:scale(var(--press-scale))}</style>
</body>
</html>
