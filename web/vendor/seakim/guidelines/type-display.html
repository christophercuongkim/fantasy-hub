<!-- @dsCard group="Type" viewport="700x300" subtitle="7xl–2xl, Outfit. Tracking tightens as size grows. Deck and hero territory." name="Display scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display scale</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px 22px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-start; gap: var(--space-5); }
  .col { display: flex; flex-direction: column; }
  .tok { font: var(--type-eyebrow); color: var(--text-tertiary); letter-spacing: var(--tracking-wide); white-space: nowrap; }
  .val { font: var(--type-eyebrow); color: var(--text-secondary); }
  
</style>
<script src="../theme-toggle.js"></script>
</head>
<body>
<div class="col" style="gap:10px">

  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">7xl 76px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-7xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">6xl 64px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-6xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">5xl 48px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-5xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">4xl 38px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-4xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">3xl 30px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-3xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
  <div class="row" style="align-items:baseline;gap:16px"><span class="tok" style="width:78px">2xl 24px</span>
  <span style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;line-height:1.05;letter-spacing:var(--tracking-tighter)">Draft night</span></div>
</div>
</body>
</html>
