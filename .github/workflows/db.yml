name: db

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "web/db/**"
      - "web/drizzle/**"
      - "web/drizzle.config.ts"
  push:
    branches: [main]
    paths:
      - "web/db/**"
      - "web/drizzle/**"
      - "web/drizzle.config.ts"

permissions:
  contents: read
  pull-requests: write # schema-diff-action posts a PR comment

concurrency:
  group: db-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On an open/updated PR: fork a Neon branch, apply migrations to it, and
  # post the schema diff so the migration is reviewed before it hits prod.
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Create Neon preview branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:migrate

      - name: Post schema diff on the PR
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  # When the PR closes (merged or not), delete its preview branch.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  # On merge to main: apply migrations to the production database.
  migrate-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm db:migrate
