name: deploy

on:
  push:
    branches: [main]
  # Manual "Run workflow" button: force-deploy on demand, bypassing path filters.
  workflow_dispatch:
    inputs:
      service:
        description: Which service to deploy
        type: choice
        options: [both, web, api]
        default: both

# Include event_name so a pull_request:closed on merge can't cancel the push deploy.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only meaningful on push (needs a diff to filter). Skipped on manual dispatch.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
            api:
              - 'api/**'

  deploy-web:
    needs: changes
    # Deploy on a manual dispatch (both|web) or when a push changed web/**.
    # always() lets this evaluate even though `changes` is skipped on dispatch.
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'web'))
        || (github.event_name == 'push' && needs.changes.outputs.web == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Dokploy web deploy
        run: |
          curl --fail --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main"}' \
            "${{ secrets.DOKPLOY_WEB_WEBHOOK }}"

  deploy-api:
    needs: changes
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'api'))
        || (github.event_name == 'push' && needs.changes.outputs.api == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Dokploy api deploy
        run: |
          curl --fail --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main"}' \
            "${{ secrets.DOKPLOY_API_WEBHOOK }}"
