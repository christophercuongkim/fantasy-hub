[project]
name = "fantasy-hub-api"
version = "0.0.0"
description = "fantasy-hub projection + simulation service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "httpx>=0.28",
    "cryptography>=44",
    "nfl_data_py>=0.3.3",
    "pyarrow>=17",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

# App, not a distributable package — uv installs deps without building this project.
[tool.uv]
package = false
# nfl_data_py pins an old pandas (1.5.3) with no Python 3.12 wheels; force a
# modern pandas/numpy that has wheels and works with nfl_data_py at runtime.
override-dependencies = ["pandas>=2.2", "numpy>=1.26"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
