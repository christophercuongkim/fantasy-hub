[project]
name = "fantasy-hub-bootstrap"
version = "0.1.0"
description = "One-time / annual Yahoo league history importer (scrape + load)."
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
